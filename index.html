<title>捕鱼大厅 · 深海捕鱼</title>
<style>
/* ============ 捕鱼大厅 - 样式 ============ */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%; overflow: hidden; background: #061a2e;
  font-family: "PingFang SC", "Microsoft YaHei", "Heiti SC", sans-serif;
  user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none;
}
#app { position: fixed; inset: 0; overflow: hidden; }

/* ---- 舞台：1180x664 设计空间，等比缩放居中 ---- */
#stage {
  position: absolute; left: 50%; top: 50%; width: 1180px; height: 664px;
  transform: translate(-50%, -50%); transform-origin: center center;
}
#bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
#hotspots, #overlays, #badges { position: absolute; inset: 0; }
#overlays, #badges { pointer-events: none; }

.hotspot { position: absolute; cursor: pointer; border-radius: 14px; }
.hotspot:active { filter: brightness(1.15); }
.hotspot .press { position: absolute; inset: 0; border-radius: 14px; background: rgba(255,255,255,.25); opacity: 0; transition: opacity .08s; }
.hotspot.pressed .press { opacity: 1; }

/* 顶栏动态数值 */
.dyn { position: absolute; color: #fff; font-weight: 800; white-space: nowrap;
  text-shadow: 0 2px 0 rgba(20,60,110,.55), 0 0 6px rgba(255,255,255,.35); pointer-events: none; }
#dynGems  { left: 372px; top: 20px; font-size: 25px; }
#dynCoins { left: 612px; top: 25px; font-size: 29px; }
#dynLv    { left: 84px;  top: 31px; font-size: 22px; }

/* 红点徽标 */
.badge { position: absolute; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px;
  background: linear-gradient(180deg,#ff5f6d,#d32f2f); color: #fff; font-size: 12px; font-weight: 700;
  line-height: 20px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.4); border: 1px solid #ffb3b3; }

/* ---- 游戏层 ---- */
#gameLayer { position: absolute; inset: 0; pointer-events: none; }
#gameLayer.on { pointer-events: auto; }
#gameLayer canvas { display: block; position: absolute; left: 0; top: 0; }

/* ---- UI 层：弹窗/提示 ---- */
#uiLayer { position: absolute; inset: 0; pointer-events: none; }
#modalScaler { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%) scale(var(--ms,1));
  width: 660px; height: 500px; pointer-events: none; }
#modalRoot { position: absolute; inset: 0; pointer-events: none; }
#modalRoot .panel { pointer-events: auto; }

.panel { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
  width: 620px; max-height: 480px; display: flex; flex-direction: column;
  background: linear-gradient(180deg, #3a86d8 0%, #1d5b9e 55%, #154a85 100%);
  border: 3px solid #ffd76a; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,.5), inset 0 2px 0 rgba(255,255,255,.25);
  color: #fff; overflow: hidden; animation: pop .18s ease-out; }
@keyframes pop { from { transform: translate(-50%,-50%) scale(.7); opacity: 0; } to { transform: translate(-50%,-50%) scale(1); opacity: 1; } }
.panel-head { position: relative; text-align: center; padding: 14px 10px 10px; flex-shrink: 0;
  background: linear-gradient(180deg, rgba(255,215,106,.28), rgba(255,215,106,0)); }
.panel-title { font-size: 24px; font-weight: 800; color: #ffe9a8; letter-spacing: 2px;
  text-shadow: 0 2px 0 #b57d1f, 0 0 12px rgba(255,220,120,.5); }
.panel-sub { font-size: 12px; color: #cfe6ff; margin-top: 3px; }
.panel-close { position: absolute; right: 10px; top: 8px; width: 34px; height: 34px; border-radius: 50%;
  background: linear-gradient(180deg,#ff8a80,#e53935); border: 2px solid #ffd7d2; color: #fff; font-size: 18px;
  font-weight: 800; cursor: pointer; line-height: 30px; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
.panel-close:active { transform: scale(.92); }
.panel-body { padding: 6px 16px 16px; overflow-y: auto; flex: 1; }
.panel-body::-webkit-scrollbar { width: 6px; } .panel-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,.3); border-radius: 3px; }

.tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; flex-wrap: wrap; }
.tab { padding: 6px 16px; border-radius: 999px; font-size: 14px; font-weight: 700; cursor: pointer;
  background: rgba(255,255,255,.14); color: #dceaff; border: 1px solid rgba(255,255,255,.25); }
.tab.on { background: linear-gradient(180deg,#ffd76a,#f5a623); color: #7a4a00; border-color: #fff3c4; }

.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.card { background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.06));
  border: 1px solid rgba(255,255,255,.28); border-radius: 14px; padding: 10px 8px; text-align: center; }
.card .ic { font-size: 34px; line-height: 1.2; }
.card .nm { font-size: 14px; font-weight: 700; margin: 4px 0 2px; }
.card .ds { font-size: 11px; color: #bcd8f5; min-height: 26px; }
.btn { display: inline-block; padding: 7px 18px; border-radius: 999px; border: none; cursor: pointer;
  font-size: 14px; font-weight: 800; color: #fff;
  background: linear-gradient(180deg,#ffb347,#ff8c42); box-shadow: 0 3px 0 #c75f17, 0 4px 8px rgba(0,0,0,.3); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #c75f17; }
.btn.green { background: linear-gradient(180deg,#7ed957,#43a047); box-shadow: 0 3px 0 #2e7d32, 0 4px 8px rgba(0,0,0,.3); }
.btn.blue { background: linear-gradient(180deg,#5cb3ff,#1976d2); box-shadow: 0 3px 0 #0d47a1, 0 4px 8px rgba(0,0,0,.3); }
.btn.gray { background: linear-gradient(180deg,#b0bec5,#78909c); box-shadow: 0 3px 0 #546e7a; }
.btn.small { padding: 4px 12px; font-size: 12px; }
.btn[disabled] { filter: grayscale(.8); opacity: .6; pointer-events: none; }

.price { display: inline-flex; align-items: center; gap: 4px; font-weight: 800; font-size: 13px; color: #ffe9a8; }
.coin-ic, .gem-ic { display: inline-block; border-radius: 50%; vertical-align: -3px; }
.coin-ic { width: 15px; height: 15px; background: radial-gradient(circle at 35% 30%, #fff6c2, #ffc531 55%, #d99400);
  border: 1px solid #a86e00; box-shadow: inset 0 -2px 2px rgba(120,70,0,.4); }
.gem-ic { width: 14px; height: 14px; background: linear-gradient(135deg, #9be8ff, #2f9dff 55%, #7b5cff);
  border-radius: 3px; transform: rotate(45deg); border: 1px solid #bfeaff; }

.row { display: flex; align-items: center; gap: 10px; }
.list { display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.1);
  border: 1px solid rgba(255,255,255,.22); border-radius: 12px; padding: 8px 12px; }
.item .ic { font-size: 28px; }
.item .info { flex: 1; }
.item .nm { font-size: 14px; font-weight: 700; }
.item .ds { font-size: 11px; color: #bcd8f5; }
.item.done { opacity: .55; }

.sign-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.sign-day { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); border-radius: 10px;
  padding: 8px 2px; text-align: center; font-size: 11px; }
.sign-day .d { color: #ffe9a8; font-weight: 700; }
.sign-day .r { font-size: 16px; margin: 3px 0; }
.sign-day.got { background: rgba(76,175,80,.35); }
.sign-day.today { border-color: #ffd76a; box-shadow: 0 0 8px rgba(255,215,106,.7); }

.wheel-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
#wheelCanvas { border-radius: 50%; box-shadow: 0 0 0 6px #ffd76a, 0 8px 24px rgba(0,0,0,.45); }

.kv { display: flex; justify-content: space-between; font-size: 13px; padding: 5px 2px; border-bottom: 1px dashed rgba(255,255,255,.18); }
.kv b { color: #ffe9a8; }
.center { text-align: center; }
.mt8 { margin-top: 8px; } .mt12 { margin-top: 12px; }
.hint { font-size: 12px; color: #bcd8f5; line-height: 1.6; }
input.code-input { width: 100%; padding: 10px; border-radius: 10px; border: 2px solid #ffd76a;
  background: rgba(0,20,50,.5); color: #fff; font-size: 16px; text-align: center; letter-spacing: 2px; outline: none; }

/* 结算面板 */
.result-panel { width: 460px; }
.result-title { font-size: 30px; font-weight: 800; color: #ffe9a8; text-align: center;
  text-shadow: 0 2px 0 #b57d1f, 0 0 14px rgba(255,220,120,.6); }
.result-lines { margin: 12px 0; }
.result-line { display: flex; justify-content: space-between; padding: 6px 4px; font-size: 15px; border-bottom: 1px dashed rgba(255,255,255,.2); }
.result-line b { color: #ffe9a8; }
.result-btns { display: flex; gap: 12px; justify-content: center; margin-top: 14px; }

/* Toast */
#toastRoot { position: absolute; left: 0; right: 0; bottom: 16%; display: flex; flex-direction: column;
  align-items: center; gap: 6px; pointer-events: none; }
.toast { background: rgba(10,30,60,.92); border: 1px solid #ffd76a; color: #ffe9a8; font-size: 14px;
  font-weight: 700; padding: 8px 22px; border-radius: 999px; box-shadow: 0 4px 14px rgba(0,0,0,.4);
  animation: toastIn .18s ease-out; }
@keyframes toastIn { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }

/* 广告模拟 */
#adOverlay { position: absolute; inset: 0; background: rgba(0,0,0,.88); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px; pointer-events: auto; z-index: 50; }
#adOverlay .ad-box { width: 320px; padding: 26px; border-radius: 16px; text-align: center;
  background: linear-gradient(180deg,#3a86d8,#154a85); border: 2px solid #ffd76a; color: #fff; }
#adOverlay .ad-t { font-size: 18px; font-weight: 800; color: #ffe9a8; }
#adOverlay .ad-c { font-size: 34px; font-weight: 800; margin-top: 8px; }
#adOverlay.hidden { display: none; }

/* 转场遮罩 */
#fade { position: absolute; inset: 0; background: #03101f; opacity: 0; pointer-events: none; transition: opacity .22s; z-index: 40; }
#fade.on { opacity: 1; }

/* 横屏提示 */
#rotate { position: absolute; inset: 0; background: #061a2e; display: none; flex-direction: column;
  align-items: center; justify-content: center; gap: 16px; z-index: 100; color: #cfe6ff; }
#rotate.show { display: flex; }
#rotate .ph { width: 74px; height: 128px; border: 4px solid #7fb8ef; border-radius: 14px; animation: rot 1.6s ease-in-out infinite; }
@keyframes rot { 0%,40% { transform: rotate(0); } 60%,100% { transform: rotate(90deg); } }

</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="bg"></div>
    <div id="hotspots"></div>
    <div id="overlays">
      <div class="dyn" id="dynGems">10</div>
      <div class="dyn" id="dynCoins">216003</div>
      <div class="dyn" id="dynLv">LV.1</div>
    </div>
    <div id="badges"></div>
  </div>
  <div id="gameLayer"></div>
  <div id="uiLayer">
    <div id="modalScaler"><div id="modalRoot"></div></div>
    <div id="toastRoot"></div>
    <div id="adOverlay" class="hidden"></div>
    <div id="fade"></div>
  </div>

<script>
/* ============ 核心：工具 / 音频 / 存档 / 舞台 ============ */
(function () {
  const FL = (window.FL = {});

  /* ---------- 工具 ---------- */
  const U = (FL.util = {
    $(s) { return document.querySelector(s); },
    el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; },
    rand(a, b) { return a + Math.random() * (b - a); },
    randi(a, b) { return Math.floor(a + Math.random() * (b - a + 1)); },
    clamp(v, a, b) { return v < a ? a : v > b ? b : v; },
    lerp(a, b, t) { return a + (b - a) * t; },
    dist(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); },
    fmt(n) { return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","); },
    today() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); },
    pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; },
    chance(p) { return Math.random() < p; },
    shade(hex, amt) {
      const n = parseInt(hex.slice(1), 16);
      const r = U.clamp((n >> 16) + amt, 0, 255), g = U.clamp(((n >> 8) & 255) + amt, 0, 255), b = U.clamp((n & 255) + amt, 0, 255);
      return "#" + ((r << 16) | (g << 8) | b).toString(16).padStart(6, "0");
    },

(function () {
  const FL = window.FL, U = FL.util, A = FL.art;

  FL.games.arena = class extends FL.Game {
    constructor() { super("arena", { name: "竞技场", desc: "挑战蓝龙王", time: 60 }); }

      this.bullets = []; this.bubbles = []; this.minions = []; this.parts2 = [];
      this.dmg = 0; this.playerHp = 120; this.fireCd = 0; this.fireT = 9;
      this.boss = { x: 590, y: 190, t: 0, hp: 10000, maxHp: 10000, r: 66, mode: 0, modeT: 2, hitT: 0, vx: 0, vy: 0, telegraph: 0 };

      this.bubbles0 = []; for (let i = 0; i < 20; i++) this.bubbles0.push({ x: U.rand(0, 1180), y: U.rand(0, 664), r: U.rand(2, 6), v: U.rand(12, 30) });
    }
    update(dt) {
      const b = this.boss;
      b.t += dt;
      if (b.hitT > 0) b.hitT -= dt;
      // Boss 行为
      b.modeT -= dt;
      if (b.modeT <= 0) {
        b.mode = (b.mode + 1) % 3;
        b.modeT = U.rand(3.2, 4.4);
        b.telegraph = 0.6;
        if (b.mode === 2) { const a = Math.atan2(this.y - b.y, this.x - b.x); b.vx = Math.cos(a) * 420; b.vy = Math.sin(a) * 420; }
      }
      if (b.telegraph > 0) b.telegraph -= dt;
      if (b.mode === 0) { // 游走
        b.x = 590 + Math.sin(b.t * 0.6) * 400;
        b.y = 180 + Math.sin(b.t * 1.1) * 90;
      } else if (b.mode === 1) { // 瞄准射击
        b.x = U.lerp(b.x, 590, dt); b.y = U.lerp(b.y, 170, dt);
        if (b.telegraph <= 0 && Math.random() < dt * 1.6) {
          const a = Math.atan2(this.y - b.y, this.x - b.x) + U.rand(-0.12, 0.12);

        let hit = false;
        for (const m of this.minions) if (U.dist(p.x, p.y, m.x, m.y) < m.r + 8) { m.hp--; hit = true; this.spark(p.x, p.y, "#bfe6ff", 4, 100, 0.3); break; }
        if (!hit && U.dist(p.x, p.y, b.x, b.y) < b.r + 10) {
          const d = Math.round(120 * p.power);

      }
      // 小怪
      this.minionT -= dt;

        }

      for (let i = this.minions.length - 1; i >= 0; i--) {

          this.minions.splice(i, 1);

          this.playerHp -= 10;
          this.shake(7); FL.audio.hit();
          this.spark(p.x, p.y, "#9be8ff", 10, 180, 0.4);
          this.bubbles.splice(i, 1);
          if (this.playerHp <= 0) { this.defeat(); return; }
          continue;
        }
        if (p.x < -30 || p.x > 1210 || p.y < -30 || p.y > 700 || p.t > 6) this.bubbles.splice(i, 1);
      }
      for (const bb of this.bubbles0) { bb.y -= bb.v * dt; if (bb.y < -8) { bb.y = 672; bb.x = U.rand(0, 1180); } }
      this.fireT += 1 / 60;
    }
    fire() {
      const a = this.ang;
      this.bullets.push({ x: this.x + Math.cos(a) * 46, y: this.y + Math.sin(a) * 46, vx: Math.cos(a) * 700, vy: Math.sin(a) * 700, life: 1.4, power: 1 + (this.lv - 1) * 0.28 });
      this.fireT = 0;

    onMove(x, y) {
      let a = Math.atan2(y - this.y, x - this.x);

    }
    victory() {
      const bonus = 2000;
      FL.state.addCoins(bonus); this.addEarned(bonus);
      FL.state.addExp(60);
      FL.state.setBest("arena", this.dmg);

      this.finish({

    defeat() {

      FL.state.addExp(20);

      this.finish({
        title: "炮台被击毁…",
        lines: [
          ["造成伤害", U.fmt(this.dmg)],
          ["评价", this.rank()],
          ["伤害奖励", "+" + U.fmt(Math.floor(this.dmg / 5)) + " 金币"],

      });
      FL.state.addCoins(Math.floor(this.dmg / 5));
      this.addEarned(Math.floor(this.dmg / 5));
    }
    rank() { return this.dmg >= 7000 ? "S 级战神" : this.dmg >= 4000 ? "A 级猎手" : this.dmg >= 1500 ? "B 级炮手" : "C 级新手"; }
    draw(ctx) {
      // 竞技场背景：黄昏海面
      const g = ctx.createLinearGradient(0, 0, 0, 664);
      g.addColorStop(0, "#2b1055"); g.addColorStop(0.45, "#7597de"); g.addColorStop(1, "#f7b267");
      ctx.fillStyle = g; ctx.fillRect(0, 0, 1180, 664);
      ctx.fillStyle = "rgba(255,230,180,.5)";

      ctx.fillStyle = "#1d4e89";
      ctx.beginPath(); ctx.moveTo(0, 560);
      for (let x = 0; x <= 1180; x += 80) ctx.lineTo(x, 545 - Math.sin(x * 0.01) * 22);

/* ============ 游戏4：炸弹乐园（抛物线轰炸） ============ */
(function () {
  const FL = window.FL, U = FL.util, A = FL.art;

  const TYPES = {
    octopus: { hp: 2, val: 25, r: 26 },
    crab: { hp: 2, val: 20, r: 22 },
    balloon: { hp: 1, val: 15, r: 18 },
    chest: { hp: 5, val: 120, r: 30 },
  };

  FL.games.bomb = class extends FL.Game {
    constructor() { super("bomb", { name: "炸弹乐园", desc: "抛物线轰炸", time: 60 }); }
    init() {
      this.cx = 110; this.cy = 596;
      this.targets = []; this.bombs = []; this.booms = [];
      this.drag = false; this.ax = 0; this.ay = 0; this.cd = 0; this.combo = 0; this.comboT = 0;
      this.spawnT = 0.6; this.chestT = 10;
      this.shelves = [
        { x: 330, y: 330, w: 380 }, { x: 760, y: 400, w: 340 }, { x: 330, y: 480, w: 380 },
      ];
      for (let i = 0; i < 5; i++) this.spawnTarget();
    }
    spawnTarget(force) {
      const roll = Math.random();
      let type = roll < 0.4 ? "octopus" : roll < 0.75 ? "crab" : "balloon";
      const t = TYPES[type];
      let sh = U.pick(this.shelves), x = 0;
      for (let tries = 0; tries < 6; tries++) {
        sh = U.pick(this.shelves);
        x = U.rand(sh.x + 40, sh.x + sh.w - 40);
        const clash = this.targets.some(g => U.dist(x, sh.y - 30, g.x, g.y) < 70);
        if (!clash) break;
      }
      this.targets.push({
        type, hp: t.hp, maxHp: t.hp, val: t.val, r: t.r,
        x, y: sh.y - 30, baseY: sh.y - 30, t: U.rand(0, 9),
        range: U.rand(40, 110), dir: Math.random() < 0.5 ? 1 : -1, sp: U.rand(20, 46),
        shelf: sh, bob: U.rand(0, 9), hitT: 0,
      });
    }
    spawnChest() {
      const sh = this.shelves[1];
      this.targets.push({ type: "chest", hp: TYPES.chest.hp, maxHp: TYPES.chest.hp, val: TYPES.chest.val, r: TYPES.chest.r, x: sh.x + sh.w / 2, y: sh.y - 36, baseY: sh.y - 36, t: 0, range: 0, dir: 1, sp: 0, shelf: sh, bob: 0, hitT: 0 });
      this.showBanner("宝箱空降！击碎得 120 金币");
    }
    update(dt) {
      this.cd -= dt;
      if (this.comboT > 0) { this.comboT -= dt; if (this.comboT <= 0) this.combo = 0; }
      // 目标
      this.spawnT -= dt;
      if (this.spawnT <= 0 && this.targets.length < 9) { this.spawnT = U.rand(0.7, 1.3); this.spawnTarget(); }
      this.chestT -= dt;
      if (this.chestT <= 0) { this.chestT = U.rand(16, 24); this.spawnChest(); }
      for (const g of this.targets) {
        g.t += dt;
        if (g.hitT > 0) g.hitT -= dt;
        if (g.type === "crab") { g.x += g.sp * g.dir * dt; if (g.x < g.shelf.x + 40 || g.x > g.shelf.x + g.shelf.w - 40) g.dir *= -1; }
        if (g.type === "balloon") { g.y = g.baseY + Math.sin(g.t * 1.4 + g.bob) * 46; }
        else g.y = g.baseY + Math.sin(g.t * 2 + g.bob) * 4;
      }
      // 炸弹飞行
      for (let i = this.bombs.length - 1; i >= 0; i--) {
        const b = this.bombs[i];
        b.vy += 1150 * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.rot += b.vx * dt * 0.05; b.t += dt;
        let hit = null;
        for (const g of this.targets) if (U.dist(b.x, b.y, g.x, g.y) < g.r + 12) { hit = g; break; }
        const onGround = b.y > 606;
        const onShelf = this.shelves.some(s => b.y > s.y - 6 && b.y < s.y + 10 && b.x > s.x && b.x < s.x + s.w);
        if (hit || onGround || onShelf || b.x < -30 || b.x > 1210 || b.t > 4) {
          this.blowUp(b.x, b.y);
          this.bombs.splice(i, 1);
        }
      }
      // 爆炸
      for (let i = this.booms.length - 1; i >= 0; i--) {
        const bo = this.booms[i]; bo.life -= dt; bo.r = U.lerp(bo.r, bo.max, dt * 10);
        if (bo.life <= 0) this.booms.splice(i, 1);
      }
    }
    blowUp(x, y) {
      this.booms.push({ x, y, r: 10, max: 96, life: 0.35 });
      this.shake(5); FL.audio.bomb();
      this.spark(x, y, "#ffb74d", 14, 240, 0.5);
      for (const g of this.targets) {
        const d = U.dist(x, y, g.x, g.y);
        if (d < 96 + g.r) {
          g.hp -= (d < g.r + 10 ? 3 : 2); g.hitT = 0.2;
          if (g.hp <= 0) {
            this.kills = (this.kills || 0) + 1;
            this.comboT = 0.8;
            this.combo++;
            if (this.combo > (this.bestCombo || 0)) this.bestCombo = this.combo;
            const mult = Math.min(5, this.combo);
            const gain = g.val * mult;
            FL.state.addCoins(gain); this.addEarned(gain); FL.state.addExp(2);
            this.coinBurst(g.x, g.y, 10);
            this.floatText(g.x, g.y - 30, "+" + gain + (mult > 1 ? " x" + mult + "连击" : ""), "#ffe9a8", mult > 2 ? 24 : 19);
            if (mult >= 3) { this.showBanner(mult + " 连击！"); FL.audio.bigwin(); } else FL.audio.coin();
          } else {
            this.spark(g.x, g.y, "#ffe0b2", 6, 140, 0.3);
          }
        }
      }
      this.targets = this.targets.filter(g => g.hp > 0);
    }
    launch(tx, ty, tap) {
      if (this.cd > 0) return;
      let a, sp;
      if (tap) {
        // 点击模式：以 52° 角自动求解命中该点所需初速度
        const dx = tx - this.cx, dy = ty - this.cy;
        const dir = dx >= 0 ? 1 : -1;
        const th = 52 * Math.PI / 180;
        const adx = Math.abs(dx);
        const denom = 2 * Math.cos(th) * Math.cos(th) * (adx * Math.tan(th) - dy);
        const v2 = denom > 0 ? 1150 * adx * adx / denom : 90000;
        sp = U.clamp(Math.sqrt(v2), 350, 1350);
        a = -dir * th;
      } else {
        a = Math.atan2(ty - this.cy, tx - this.cx);
        const power = U.clamp(U.dist(tx, ty, this.dragX0, this.dragY0) / 200, 0.35, 1);
        sp = 300 + power * 800;
      }
      this.bombs.push({ x: this.cx, y: this.cy - 20, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, rot: 0, t: 0 });
      this.cd = 0.7;
      FL.audio.shoot();
      this.spark(this.cx, this.cy - 20, "#ffe680", 5, 120, 0.3);
    }
    onDown(x, y) { this.drag = true; this.dragX0 = x; this.dragY0 = y; this.ax = x; this.ay = y; }
    onMove(x, y) { if (this.drag) { this.ax = x; this.ay = y; } }
    onUp(x, y) {
      if (!this.drag) return;
      this.drag = false;
      this.launch(x, y, U.dist(x, y, this.dragX0, this.dragY0) < 24);
    }
    draw(ctx) {
      // 海滩背景
      const g = ctx.createLinearGradient(0, 0, 0, 664);
      g.addColorStop(0, "#8fd6f7"); g.addColorStop(0.5, "#4facfe"); g.addColorStop(0.72, "#2e8bd8"); g.addColorStop(0.73, "#f6d9a8"); g.addColorStop(1, "#e8c07d");
      ctx.fillStyle = g; ctx.fillRect(0, 0, 1180, 664);
      // 海面波光
      ctx.fillStyle = "rgba(255,255,255,.25)";
      for (let i = 0; i < 8; i++) { ctx.beginPath(); ctx.ellipse(120 + i * 145, 470 + (i % 3) * 14, 70, 6, 0, 0, Math.PI * 2); ctx.fill(); }
      // 架子
      for (const s of this.shelves) {
        ctx.fillStyle = "#a9682f";
        A.roundRect(ctx, s.x, s.y, s.w, 12, 6); ctx.fill();
        ctx.fillStyle = "#8d5524";
        ctx.fillRect(s.x + 16, s.y + 12, 10, 26); ctx.fillRect(s.x + s.w - 26, s.y + 12, 10, 26);
      }
      // 目标
      for (const gm of this.targets) {
        ctx.save(); ctx.translate(gm.x, gm.y);
        if (gm.hitT > 0) { ctx.shadowColor = "#fff"; ctx.shadowBlur = 14; }
        if (gm.type === "octopus") A.fish(ctx, "octopus", gm.t);
        else if (gm.type === "crab") A.fish(ctx, "crab", gm.t);
        else if (gm.type === "chest") A.chest(ctx, 0, 10, 1.4, false);
        else { // 气球
          ctx.strokeStyle = "rgba(255,255,255,.6)"; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(0, 14); ctx.lineTo(0, 34); ctx.stroke();
          ctx.fillStyle = "#ff6b81";
          ctx.beginPath(); ctx.ellipse(0, 0, 16, 19, 0, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "rgba(255,255,255,.5)";
          ctx.beginPath(); ctx.ellipse(-5, -6, 5, 7, -0.5, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
        if (gm.maxHp > 1) {
          const w = 30;
          ctx.fillStyle = "rgba(0,0,0,.4)"; ctx.fillRect(gm.x - w / 2, gm.y - gm.r - 12, w, 4);
          ctx.fillStyle = "#7ed957"; ctx.fillRect(gm.x - w / 2, gm.y - gm.r - 12, w * (gm.hp / gm.maxHp), 4);
        }
      }
      // 轨迹预览（拖拽蓄力）
      if (this.drag && U.dist(this.ax, this.ay, this.dragX0, this.dragY0) >= 24) {
        const a = Math.atan2(this.ay - this.cy, this.ax - this.cx);
        const power = U.clamp(U.dist(this.ax, this.ay, this.dragX0, this.dragY0) / 200, 0.35, 1);
        const sp = 300 + power * 800;
        let px = this.cx, py = this.cy - 20, vx = Math.cos(a) * sp, vy = Math.sin(a) * sp;
        ctx.fillStyle = "rgba(255,255,255,.75)";
        for (let i = 0; i < 22; i++) {
          vy += 1150 * 0.045; px += vx * 0.045; py += vy * 0.045;
          if (py > 600) break;
          ctx.beginPath(); ctx.arc(px, py, 3.5 - i * 0.1, 0, Math.PI * 2); ctx.fill();
        }
        // 力度条
        ctx.save();
        A.roundRect(ctx, 24, 520, 20, 90, 10); ctx.fillStyle = "rgba(3,25,55,.6)"; ctx.fill();
        ctx.strokeStyle = "#ffd34d"; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = power > 0.8 ? "#ff5252" : "#ffb347";
        A.roundRect(ctx, 27, 610 - 84 * power, 14, 84 * power, 7); ctx.fill();
        this.txt(34, 505, "力度", 12, "#fff", "center", 700);
        ctx.restore();
      }
      // 炸弹
      for (const b of this.bombs) {
        ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot);
        ctx.fillStyle = "#263238";
        ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#546e7a";
        ctx.fillRect(-3, -15, 6, 6);
        ctx.fillStyle = Math.sin(b.t * 30) > 0 ? "#ffeb3b" : "#ff9800";
        ctx.beginPath(); ctx.arc(0, -16, 3, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
      // 爆炸
      for (const bo of this.booms) {
        ctx.save(); ctx.globalAlpha = U.clamp(bo.life / 0.35, 0, 1);
        const rg = ctx.createRadialGradient(bo.x, bo.y, 4, bo.x, bo.y, bo.r);
        rg.addColorStop(0, "rgba(255,255,220,.95)"); rg.addColorStop(0.5, "rgba(255,152,0,.8)"); rg.addColorStop(1, "rgba(255,87,34,0)");
        ctx.fillStyle = rg;
        ctx.beginPath(); ctx.arc(bo.x, bo.y, bo.r, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
      // 发射架
      ctx.save(); ctx.translate(this.cx, this.cy);
      ctx.fillStyle = "#5d4037";
      A.roundRect(ctx, -26, -8, 52, 40, 8); ctx.fill();
      const a2 = this.drag ? Math.atan2(this.cy - this.ay, this.cx - this.ax) : -Math.PI / 2.6;
      ctx.save(); ctx.rotate(a2);
      ctx.fillStyle = "#37474f";
      A.roundRect(ctx, 0, -8, 46, 16, 6); ctx.fill();
      ctx.restore();
      ctx.restore();
      // HUD
      this.topBar(() => {
        ctx.save();
        A.roundRect(ctx, 124, 12, 230, 44, 22); ctx.fillStyle = "rgba(3,25,55,.62)"; ctx.fill();
        ctx.strokeStyle = "rgba(255,215,106,.85)"; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
        A.coinIcon(ctx, 148, 34, 14);
        this.txt(170, 34, U.fmt(this.earned) + " 金币", 19, "#ffe9a8", "left", 800);
        if (this.combo > 1) this.txt(FL.stage.W - 210, 34, this.combo + " 连击!", 20, "#ff8a80", "center", 800);
      }, true);
      if (this.t < 7) {
        ctx.save(); ctx.globalAlpha = U.clamp(7 - this.t, 0, 1);
        this.txt(590, 96, "点击目标直接轰炸 · 或拖拽蓄力松手发射（蓝色虚线为轨迹）", 18, "#fff", "center", 800);
        ctx.restore();
      }
      if (this.bannerT > 0 && this.banner) {
        ctx.save(); ctx.globalAlpha = U.clamp(this.bannerT, 0, 1);
        A.roundRect(ctx, 340, 96, 500, 48, 24); ctx.fillStyle = "rgba(20,60,120,.85)"; ctx.fill();
        ctx.strokeStyle = "#ffd34d"; ctx.lineWidth = 2; ctx.stroke();
        this.txt(590, 121, this.banner, 20, "#ffe9a8", "center", 800);
        ctx.restore();
      }
    }
    showBanner(s) { this.banner = s; this.bannerT = 1.8; }
    stats() {
      return [
        ["本局收益", "+" + U.fmt(this.earned) + " 金币"],
        ["击破目标", (this.kills || 0) + " 个"],
        ["最高连击", "x" + (this.bestCombo || 0)],
      ];
    }
    timeUp() {
      FL.state.setBest("bomb", this.earned);
      FL.state.addExp(15);
      this.finish({
        title: "轰炸结束！",
        lines: this.stats(),

    }
    quit() {
      FL.state.setBest("bomb", Math.max(FL.state.data.best.bomb, this.earned));
      super.quit();
    }
  };
})();

/* ============ 游戏5：南海寻宝（挖宝闯关） ============ */
(function () {
  const FL = window.FL, U = FL.util, A = FL.art;

  FL.games.treasure = class extends FL.Game {
    constructor() { super("treasure", { name: "南海寻宝", desc: "挖宝闯关", time: 0 }); }
    init() {
      this.level = 1;
      this.net = 0; this.rounds = 0; this.bestSafe = 0;
      this.bets = [100, 500, 1000, 5000]; this.betIdx = 0;
      this.grid = []; this.cells = [];
      this.revealed = 0; this.currentWin = 0; this.roundActive = false;
      this.endT = 0; this.endMsg = null; this.endOk = false;
      this.hover = -1;
      this.buildGrid();
    }
    buildGrid() {
      const cw = 92, ch = 76, gap = 10;
      this.cw = cw; this.ch = ch;
      this.x0 = 590 - (5 * cw + 4 * gap) / 2;
      this.y0 = 148;
      for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++) {
        this.cells.push({ x: this.x0 + c * (cw + gap), y: this.y0 + r * (ch + gap), w: cw, h: ch });
      }
    }
    newRound() {
      const bet = this.bets[this.betIdx];
      if (!FL.state.pay(bet)) { this.roundActive = false; return; }
      this.net -= bet; this.rounds++;
      // 5 炸弹 + 12×2 + 5×3 + 2×5 + 1×10
      const arr = [0, 0, 0, 0, 0, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 3, 3, 3, 3, 3, 5, 5, 10];
      for (let i = arr.length - 1; i > 0; i--) { const j = U.randi(0, i); [arr[i], arr[j]] = [arr[j], arr[i]]; }
      this.grid = arr;
      this.revealed = 0; this.currentWin = 0; this.roundActive = true; this.endT = 0; this.endMsg = null;
    }
    onDown(x, y) {
      if (!this.roundActive) { this.newRound(); return; }
      for (let i = 0; i < this.cells.length; i++) {
        const c = this.cells[i];
        if (x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h) {
          if (this.revealedFlag && this.revealedFlag[i]) return;
          this.dig(i);
          return;
        }
      }
    }
    onMove(x, y) {
      this.hover = -1;
      if (this.roundActive) for (let i = 0; i < this.cells.length; i++) {
        const c = this.cells[i];
        if (x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h) { this.hover = i; break; }
      }
    }
    dig(i) {
      if (!this.revealedFlag) this.revealedFlag = {};
      this.revealedFlag[i] = true;
      this.revealed++;
      const m = this.grid[i];
      const bet = this.bets[this.betIdx];
      if (m === 0) {
        // 炸弹
        this.roundActive = false;
        this.endOk = false;
        this.endMsg = "踩到炸弹！本局无收获";
        this.endT = 2;
        this.level = 1;
        this.shake(10); FL.audio.bomb();
        this.spark(this.cells[i].x + this.cw / 2, this.cells[i].y + this.ch / 2, "#ff8a80", 18, 260, 0.6);
        FL.state.task("digs", 1);
      } else {
        const gain = m * bet;
        this.currentWin += gain;
        FL.audio.coin();
        this.coinBurst(this.cells[i].x + this.cw / 2, this.cells[i].y + this.ch / 2, 8);
        this.floatText(this.cells[i].x + this.cw / 2, this.cells[i].y, "+" + gain, "#ffe9a8", 20);
        if (this.revealed >= 20) {
          // 全清
          const bonus = bet * 5 * this.level;
          this.currentWin += bonus;
          this.level++;
          this.bestSafe = Math.max(this.bestSafe, this.revealed);
          this.endOk = true;
          this.endMsg = "全部挖开！奖励 +" + bonus + "，进入第 " + this.level + " 层";
          this.endT = 2.4;
          this.roundActive = false;
          FL.audio.win(); FL.audio.bigwin();
        }
      }
    }
    cashout() {
      if (!this.roundActive || this.currentWin <= 0) return;
      FL.state.addCoins(this.currentWin);
      this.addEarned(this.currentWin);
      this.net += this.currentWin;
      FL.state.addExp(3);
      FL.audio.win();
      this.floatText(590, 300, "收获 +" + U.fmt(this.currentWin), "#ffe9a8", 30);
      this.roundActive = false;
      this.endOk = true;
      this.endMsg = "已收入 +" + U.fmt(this.currentWin) + " 金币";
      this.endT = 1.6;
      FL.state.task("digs", 1);
    }
    update(dt) {
      if (!this.roundActive && this.endT > 0) {
        this.endT -= dt;
        if (this.endT <= 0) { this.revealedFlag = null; this.newRound(); }
      }
    }
    draw(ctx) {
      A.seaBg(ctx, 1180, 664, this.t, false);
      // 提示
      if (!this.roundActive && this.endT <= 0) {
        this.txt(590, 120, "点击任意位置开始新一局（押注 " + U.fmt(this.bets[this.betIdx]) + "）", 20, "#ffe9a8", "center", 800);
      }
      // 格子
      for (let i = 0; i < this.cells.length; i++) {
        const c = this.cells[i];
        const open = this.revealedFlag && this.revealedFlag[i];
        ctx.save();
        if (i === this.hover && !open) { ctx.shadowColor = "#ffe680"; ctx.shadowBlur = 14; }
        const g = ctx.createLinearGradient(0, c.y, 0, c.y + c.h);
        if (open) { g.addColorStop(0, "#caa46a"); g.addColorStop(1, "#a97e45"); }
        else { g.addColorStop(0, "#f7dfae"); g.addColorStop(1, "#e3c07d"); }
        ctx.fillStyle = g;
        A.roundRect(ctx, c.x, c.y, c.w, c.h, 10); ctx.fill();
        ctx.strokeStyle = open ? "#8d5524" : "#c89b5f"; ctx.lineWidth = 2; ctx.stroke();
        ctx.restore();
        if (open) {
          const m = this.grid[i];
          if (m === 0) {
            // 炸弹
            ctx.save(); ctx.translate(c.x + c.w / 2, c.y + c.h / 2);
            ctx.fillStyle = "#263238"; ctx.beginPath(); ctx.arc(0, 2, 16, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = "#90a4ae"; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(6, -12); ctx.lineTo(14, -22); ctx.stroke();
            ctx.fillStyle = Math.sin(this.t * 10) > 0 ? "#ffeb3b" : "#ff9800";
            ctx.beginPath(); ctx.arc(15, -23, 4, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
          } else {
            A.coinIcon(ctx, c.x + c.w / 2 - 14, c.y + c.h / 2, 15);
            this.txt(c.x + c.w / 2 + 16, c.y + c.h / 2 + 1, "×" + m, 20, "#7a4a00", "center", 800);
          }
        } else {
          this.txt(c.x + c.w / 2, c.y + c.h / 2 + 1, "?", 26, "#b07d2b", "center", 800);
        }
      }
      // 底部操作栏
      ctx.save();
      A.roundRect(ctx, 300, 596, 580, 52, 26); ctx.fillStyle = "rgba(3,25,55,.62)"; ctx.fill();
      ctx.strokeStyle = "rgba(255,215,106,.85)"; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
      this.txt(324, 622, "押注", 15, "#cfe6ff", "left", 700);
      this.bets.forEach((b, i) => {
        const bx = 372 + i * 84;
        this.hudBtn("bet" + i, bx, 604, 74, 36, U.fmt(b), () => {
          if (this.roundActive) { FL.toast("本局进行中，结束后可调整"); return; }
          this.betIdx = i; FL.audio.click();
        }, { style: i === this.betIdx ? "orange" : "gray", size: 13 });
      });
      this.hudBtn("cash", 712, 604, 152, 36, "收获 " + U.fmt(this.currentWin), () => this.cashout(), { style: "green", size: 14 });
      // 顶部信息
      this.topBar(() => {
        ctx.save();
        A.roundRect(ctx, 124, 12, 300, 44, 22); ctx.fillStyle = "rgba(3,25,55,.62)"; ctx.fill();
        ctx.strokeStyle = "rgba(255,215,106,.85)"; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
        this.txt(140, 34, "层数", 14, "#cfe6ff", "left", 700);
        this.txt(178, 34, "第 " + this.level + " 层", 19, "#ffe9a8", "left", 800);
        this.txt(272, 34, "净收益", 14, "#cfe6ff", "left", 700);
        this.txt(330, 34, (this.net >= 0 ? "+" : "") + U.fmt(this.net), 19, "#7ed957", "left", 800);
        this.txt(FL.stage.W - 250, 34, "剩余安全格 " + (20 - this.revealed), 15, "#cfe6ff", "right", 700);
      }, true);
      // 回合结束提示
      if (this.endT > 0 && this.endMsg) {
        ctx.save(); ctx.globalAlpha = U.clamp(this.endT, 0, 1);
        A.roundRect(ctx, 330, 250, 520, 70, 18); ctx.fillStyle = "rgba(20,60,120,.9)"; ctx.fill();
        ctx.strokeStyle = this.endOk ? "#7ed957" : "#ff5252"; ctx.lineWidth = 2; ctx.stroke();
        this.txt(590, 285, this.endMsg, 20, this.endOk ? "#b9f6ca" : "#ff8a80", "center", 800);
        ctx.restore();
      }
    }
    stats() {
      return [
        ["本局净收益", (this.net >= 0 ? "+" : "") + U.fmt(this.net) + " 金币"],
        ["挖宝轮数", this.rounds + " 轮"],
        ["到达层数", "第 " + this.level + " 层"],
      ];
    }
    quit() {
      FL.state.setBest("treasure", Math.max(0, this.net));
      FL.state.task("digs", 1);
      super.quit();
    }
  };
})();

  function buildHotspots() {
    const root = U.$("#hotspots");
    HOTSPOTS.forEach(h => {
      const d = U.el("div", "hotspot");
      d.style.left = h.x + "px"; d.style.top = h.y + "px";
      d.style.width = h.w + "px"; d.style.height = h.h + "px";
      d.dataset.id = h.id;
      if (h.group) d.dataset.group = h.group;
      d.title = h.label;
      d.appendChild(U.el("div", "press"));
      d.addEventListener("pointerdown", e => { e.preventDefault(); d.classList.add("pressed"); FL.audio.ensure(); });
      d.addEventListener("pointerup", e => { e.preventDefault(); d.classList.remove("pressed"); });
      d.addEventListener("pointerleave", () => d.classList.remove("pressed"));
      d.addEventListener("click", () => {
        FL.audio.click();
        const fn = ACTIONS[h.id];
        if (fn) fn();
      });
      root.appendChild(d);
    });
  }

  FL.ui = {
    modal(o) {
      const root = U.$("#modalRoot");

        '<div class="panel-head"><div class="panel-title">' + o.title + "</div>" +

        (o.closable === false ? "" : '<div class="panel-close">✕</div>') +
        '<div class="panel-body"></div>';

      const close = () => { root.innerHTML = ""; if (o.onClose) o.onClose(); FL.hud.refreshBadges(); };

      return { panel: p, body, close };

    toast(msg) {
      const root = U.$("#toastRoot");

          ).join("") + "</div>" +

          if (d.dailies.signin.last !== yStr) d.dailies.signin.streak = 0;

        { label: "冰冻×2", type: "skill", k: "freeze", n: 2, w: 14, color: "#a5d6a7" },
        { label: "炸弹×2", type: "skill", k: "bomb", n: 2, w: 12, color: "#ffab91" },
        { label: "金币50000", type: "coins", n: 50000, w: 3, color: "#fff176" },
        { label: "谢谢参与", type: "none", w: 10, color: "#b0bec5" },
      ];
      const m = this.modal({
        title: "灵宝大奖", sub: "每日免费转一次，或花费 2000 金币",
        body: '<div class="wheel-wrap"><canvas id="wheelCv" width="240" height="240"></canvas><div id="wheelTip" class="hint">点击转盘开始抽奖</div></div>',
      });
      const cv = m.body.querySelector("#wheelCv");
      const ctx = cv.getContext("2d");
      const R = 118;
      let rot = 0, spinning = false;
      const draw = () => {
        ctx.clearRect(0, 0, 240, 240);
        ctx.save(); ctx.translate(120, 120); ctx.rotate(rot);
        const total = PRIZES.reduce((s, p) => s + p.w, 0);
        let a = 0;
        PRIZES.forEach(p => {
          const span = (p.w / total) * Math.PI * 2;
          ctx.beginPath(); ctx.moveTo(0, 0);
          ctx.arc(0, 0, R, a, a + span); ctx.closePath();
          ctx.fillStyle = p.color; ctx.fill();
          ctx.strokeStyle = "rgba(255,255,255,.7)"; ctx.lineWidth = 2; ctx.stroke();
          ctx.save(); ctx.rotate(a + span / 2);
          ctx.fillStyle = "#4a3000"; ctx.font = 'bold 13px "PingFang SC",sans-serif';
          ctx.textAlign = "right"; ctx.textBaseline = "middle";
          ctx.fillText(p.label, R - 14, 0);
          ctx.restore();
          a += span;
        });
        ctx.restore();
        // 中心
        ctx.fillStyle = "#ffd34d";
        ctx.beginPath(); ctx.arc(120, 120, 30, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#b57d1f"; ctx.lineWidth = 3; ctx.stroke();
        ctx.fillStyle = "#7a4a00"; ctx.font = 'bold 15px "PingFang SC",sans-serif';
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("抽奖", 120, 121);
        // 指针
        ctx.fillStyle = "#e53935";
        ctx.beginPath(); ctx.moveTo(120, 4); ctx.lineTo(108, 28); ctx.lineTo(132, 28); ctx.closePath(); ctx.fill();
      };
      draw();
      const spin = () => {
        if (spinning) return;
        const free = d.spins.last !== U.today();
        if (!free && !FL.state.pay(2000)) return;
        spinning = true;
        // 权重抽奖
        const total = PRIZES.reduce((s, p) => s + p.w, 0);
        let r = Math.random() * total, idx = 0;
        for (let i = 0; i < PRIZES.length; i++) { r -= PRIZES[i].w; if (r <= 0) { idx = i; break; } }
        // 目标角度：让 idx 扇区停在指针处
        let acc = 0;
        for (let i = 0; i < idx; i++) acc += PRIZES[i].w / total;
        const mid = (acc + PRIZES[idx].w / total / 2) * Math.PI * 2;
        const target = rot + Math.PI * 2 * 5 + (Math.PI * 1.5 - (rot % (Math.PI * 2)) - mid);
        const from = rot, t0 = performance.now(), dur = 3200;
        const step = () => {
          const p = U.clamp((performance.now() - t0) / dur, 0, 1);
          const e = 1 - Math.pow(1 - p, 4);
          rot = from + (target - from) * e;
          draw();
          if (p < 1) requestAnimationFrame(step);
          else {
            spinning = false;
            const pr = PRIZES[idx];
            let msg = "";
            if (pr.type === "coins") { FL.state.addCoins(pr.n); msg = "恭喜获得 " + U.fmt(pr.n) + " 金币！"; }
            else if (pr.type === "gems") { FL.state.addGems(pr.n); msg = "恭喜获得 " + pr.n + " 钻石！"; }
            else if (pr.type === "skill") { FL.state.addSkill(pr.k, pr.n); msg = "恭喜获得道具 " + pr.label + "！"; }
            else { msg = "很遗憾，谢谢参与～"; FL.audio.lose(); }
            if (pr.type !== "none") FL.audio.bigwin();
            if (free) { d.spins.last = U.today(); FL.state.save(); }
            m.body.querySelector("#wheelTip").innerHTML = "<b style='color:#ffe9a8'>" + msg + "</b>";
            m.panel.querySelector(".panel-sub").textContent = d.spins.last === U.today() ? "下次免费需明天 · 单次 2000 金币" : "今日免费机会可用";
          }
        };
        step();
        if (Math.random() < 0.5) FL.audio.tick();
      };
      cv.addEventListener("click", spin);
    },

          '<div class="mt12" style="background:rgba(0,20,50,.5);border-radius:10px;height:16px;overflow:hidden"><div style="width:' + pct + "%;height:100%;background:linear-gradient(90deg,#7ed957,#ffd34d)\"></div></div>" +
          '<div class="hint mt8">升级奖励：每升 1 级获得 ' + (d.level + 1) + ' ×500 金币<br>捕鱼、挖宝、竞技均可获得经验</div>' +
          '<div class="list mt12"><div class="item"><div class="ic">👑</div><div class="info"><div class="nm">VIP 等级</div><div class="ds">累计充值提升，享受更多特权</div></div><button class="btn small" id="lvVip">查看</button></div></div></div>',
      });
      m.body.querySelector("#lvVip").addEventListener("click", () => { m.close(); FL.ui.vipPanel(); });
    },
    /* ---------- 设置 ---------- */
    settingsPanel() {
      const d = FL.state.data;
      const m = this.modal({
        title: "设置", sub: "音效与界面",
        body:
          '<div class="list">' +
          '<div class="item"><div class="ic">🔊</div><div class="info"><div class="nm">游戏音效</div></div><button class="btn small ' + (d.settings.sfx ? "green" : "gray") + '" id="stSfx">' + (d.settings.sfx ? "开" : "关") + "</button></div>" +
          '<div class="item"><div class="ic">🎵</div><div class="info"><div class="nm">背景音乐</div></div><button class="btn small ' + (d.settings.music ? "green" : "gray") + '" id="stMus">' + (d.settings.music ? "开" : "关") + "</button></div>" +
          '<div class="item"><div class="ic">🧹</div><div class="info"><div class="nm">隐藏两侧图标</div><div class="ds">与顶栏下拉箭头效果相同</div></div><button class="btn small" id="stHide">隐藏</button></div>' +
          '<div class="item"><div class="ic">🗑</div><div class="info"><div class="nm">重置游戏数据</div><div class="ds">清空存档，恢复初始金币</div></div><button class="btn small" id="stReset" style="background:linear-gradient(180deg,#ff8a80,#e53935)">重置</button></div>' +
          "</div>",
      });
      m.body.querySelector("#stSfx").addEventListener("click", () => { d.settings.sfx = !d.settings.sfx; FL.state.save(); FL.audio.click(); m.close(); FL.ui.settingsPanel(); });
      m.body.querySelector("#stMus").addEventListener("click", () => {
        d.settings.music = !d.settings.music; FL.state.save();
        if (d.settings.music) { FL.audio.ensure(); FL.audio.startMusic(); } else FL.audio.stopMusic();
        m.close(); FL.ui.settingsPanel();
      });
      m.body.querySelector("#stHide").addEventListener("click", () => { m.close(); toggleGroups(); });
      m.body.querySelector("#stReset").addEventListener("click", () => {
        if (!confirm("确定要重置全部游戏数据吗？")) return;
        localStorage.removeItem("iosfishlobby_v1");
        FL.state.load();
        FL.hud.sync();
        FL.toast("数据已重置");
        m.close();
      });
    },
  };

  /* 两侧图标显隐 */
  let groupsHidden = false;
  function toggleGroups() {
    groupsHidden = !groupsHidden;
    document.querySelectorAll('.hotspot[data-group="left"], .hotspot[data-group="right"]').forEach(h => {
      h.style.opacity = groupsHidden ? "0" : "1";
      h.style.pointerEvents = groupsHidden ? "none" : "auto";
    });
    FL.audio.click();
  }

  /* ================== 任务/事件辅助 ================== */
  FL.tasks = {
    claimable() {
      const t = FL.state.data.tasks;
      const defs = { shots: 30, plays: 3, arenaDmg: 5000, digs: 5 };
      return Object.keys(defs).filter(k => (t[k] || 0) >= defs[k] && t.claimed.indexOf(k) < 0);
    },
  };
  FL.events = {
    claimable() {
      const d = FL.state.data;
      if (!d.evt) d.evt = [];
      const g = [["e1", d.best.fish, 5000], ["e2", d.best.arena, 5000], ["e3", d.best.treasure, 10000]];
      return g.filter(x => x[1] >= x[2] && d.evt.indexOf(x[0]) < 0);
    },
  };

  /* 游戏内 plays 任务计数 */
  const origOpen = FL.game.open.bind(FL.game);
  FL.game.open = function (id) { FL.state.task("plays", 1); origOpen(id); };

  /* ================== 启动 ================== */
  function init() {
    FL.state.load();
    FL.stage.init();
    U.$("#bg").style.backgroundImage = "url(" + (window.__BG__ || "") + ")";
    buildHotspots();
    FL.hud.sync();
    if (FL.state.data.settings.music) FL.audio.ensure();
  }
  init();
})();

</script>
</body>
</html>
